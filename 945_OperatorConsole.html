<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
    color: #202124;
    margin: 0;
    padding: 0;
    background: #f8f9fa;
  }
  #tabs {
    display: flex;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #tabs button {
    flex: 1;
    padding: 10px 4px;
    border: none;
    background: none;
    font-size: 12px;
    color: #5f6368;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  #tabs button.active {
    color: #1a73e8;
    border-bottom-color: #1a73e8;
    font-weight: 600;
  }
  #propertyFilterBar {
    padding: 8px 10px;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
  }
  select, input, textarea {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
  }
  .view { display: none; padding: 10px; }
  .view.active { display: block; }
  section { margin-bottom: 14px; }
  h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #5f6368;
    margin: 0 0 6px 2px;
  }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 6px;
  }
  .card.overdue { border-left: 3px solid #d93025; }
  .card.upcoming { border-left: 3px solid #1a73e8; }
  .card.paid { border-left: 3px solid #188038; opacity: .85; }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-weight: 600; }
  .card-sub { color: #5f6368; font-size: 12px; margin-top: 2px; }
  .card-amount { font-weight: 600; white-space: nowrap; margin-left: 8px; }
  .btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #1a73e8;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn.secondary { background: #f1f3f4; color: #202124; }
  .btn.small { padding: 4px 10px; font-size: 11px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .pay-form {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #dadce0;
    display: flex;
    gap: 6px;
    align-items: flex-end;
  }
  .pay-form > div { flex: 1; }
  .pay-form label { display: block; font-size: 10px; color: #5f6368; margin-bottom: 2px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 3px; }
  .field-row { display: flex; gap: 8px; }
  .field-row > .field { flex: 1; }
  details { margin-bottom: 10px; }
  details summary { font-size: 12px; color: #1a73e8; cursor: pointer; padding: 4px 0; }
  .empty { color: #9aa0a6; font-size: 12px; padding: 8px 2px; }
  .toast {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    background: #202124;
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    z-index: 100;
    display: none;
  }
  .toast.error { background: #d93025; }
  .summary-box {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
  }
  .summary-total { font-size: 20px; font-weight: 700; }
  .summary-breakdown { font-size: 11px; color: #5f6368; margin-top: 4px; }
  .loading { text-align: center; color: #9aa0a6; padding: 20px; font-size: 12px; }
  .search-box { margin-bottom: 8px; }

  /* ── DLP Tab (Sidebar Phase 1, 2026-08-31) ───────────────────────── */
  .sub-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .sub-tab-btn {
    padding: 5px 10px;
    border: 1px solid #dadce0;
    border-radius: 14px;
    background: #fff;
    color: #5f6368;
    font-size: 11px;
    cursor: pointer;
  }
  .sub-tab-btn.active { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 600; }
  .dlp-sub { display: none; }
  .dlp-sub.active { display: block; }
  .back-link { display: inline-block; color: #1a73e8; font-size: 12px; cursor: pointer; margin-bottom: 10px; }
  .dlp-table-wrap { overflow-x: auto; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
  table.dlp-table { border-collapse: collapse; width: 100%; font-size: 11px; }
  table.dlp-table th, table.dlp-table td {
    padding: 6px 8px;
    text-align: left;
    border-bottom: 1px solid #f1f3f4;
    white-space: nowrap;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  table.dlp-table th {
    position: sticky; top: 0;
    background: #f8f9fa;
    color: #5f6368;
    text-transform: uppercase;
    letter-spacing: .03em;
    font-size: 10px;
  }
  table.dlp-table th:first-child, table.dlp-table td:first-child {
    position: sticky; left: 0;
    background: #fff;
    font-weight: 600;
    box-shadow: 1px 0 0 #f1f3f4;
  }
  table.dlp-table th:first-child { background: #f8f9fa; }
  table.dlp-table tbody tr { cursor: pointer; }
  table.dlp-table tbody tr:hover td { background: #f8f9fa; }
  table.dlp-table tbody tr:hover td:first-child { background: #f1f7fe; }
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    background: #f1f3f4;
    color: #5f6368;
  }
  .badge.status-open, .badge.status-pending, .badge.status-notchecked { background: #fce8e6; color: #c5221f; }
  .badge.status-inprogress, .badge.status-scheduled, .badge.status-partiallyverified { background: #fef7e0; color: #b06000; }
  .badge.status-pendingverification, .badge.status-claimedcompleted { background: #e8f0fe; color: #1a73e8; }
  .badge.status-verified, .badge.status-closed { background: #e6f4ea; color: #188038; }
  .badge.status-failedverification { background: #fce8e6; color: #c5221f; }
  .detail-grid { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .detail-field { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid #f8f9fa; font-size: 12px; }
  .detail-field:last-child { border-bottom: none; }
  .detail-label { color: #5f6368; flex-shrink: 0; }
  .detail-value { text-align: right; word-break: break-word; }
  .detail-value.empty { color: #bdc1c6; }
</style>
</head>
<body>

<nav id="tabs">
  <button data-view="dashboard" class="active">Dashboard</button>
  <button data-view="addBill">Add Bill</button>
  <button data-view="properties">Properties</button>
  <button data-view="history">History</button>
  <button data-view="dlp">DLP</button>
</nav>

<div id="propertyFilterBar">
  <select id="propertyFilter"><option value="">All Properties</option></select>
</div>

<div id="view-dashboard" class="view active">
  <div id="dashboardLoading" class="loading">Loading…</div>
  <div id="dashboardContent" style="display:none">
    <section>
      <h3>Overdue</h3>
      <div id="overdueList"></div>
    </section>
    <section>
      <h3>Due This Week</h3>
      <div id="thisWeekList"></div>
    </section>
    <section>
      <h3>Upcoming (30 days)</h3>
      <div id="upcomingList"></div>
    </section>
    <section>
      <h3>This Month</h3>
      <div class="summary-box">
        <div class="summary-total" id="monthlyTotal">—</div>
        <div class="summary-breakdown" id="monthlyBreakdown"></div>
      </div>
    </section>
    <section>
      <h3>Recent Payments</h3>
      <div id="recentPaymentsList"></div>
    </section>
  </div>
</div>

<div id="view-addBill" class="view">
  <div class="field">
    <label>Property</label>
    <select id="ob_propertyId"></select>
  </div>
  <div class="field">
    <label>Category</label>
    <select id="ob_category"></select>
  </div>
  <div class="field">
    <label>Payee</label>
    <input id="ob_payee" type="text" placeholder="e.g. Maybank, TNB, Air Selangor">
  </div>
  <div class="field-row">
    <div class="field">
      <label>Amount (MYR)</label>
      <input id="ob_amount" type="number" step="0.01" min="0">
    </div>
    <div class="field">
      <label>Frequency</label>
      <select id="ob_frequencyType"></select>
    </div>
  </div>
  <div class="field" id="ob_customIntervalField" style="display:none">
    <label>Custom interval (days)</label>
    <input id="ob_customIntervalDays" type="number" min="1">
  </div>
  <div class="field">
    <label>First due date</label>
    <input id="ob_dueAnchor" type="date">
  </div>
  <details>
    <summary>More options</summary>
    <div class="field">
      <label>Grace days (default 0)</label>
      <input id="ob_graceDays" type="number" min="0" value="0">
    </div>
    <div class="field">
      <label>End date (optional — leave blank if ongoing)</label>
      <input id="ob_endDate" type="date">
    </div>
    <div class="field">
      <label><input id="ob_autoGenerate" type="checkbox" checked style="width:auto;display:inline-block;vertical-align:middle"> Auto-generate next cycle after payment</label>
    </div>
  </details>
  <button class="btn" id="ob_submit" style="width:100%">Add Bill</button>
</div>

<div id="view-properties" class="view">
  <div id="propertiesList"></div>
  <button class="btn secondary" id="showAddPropertyBtn" style="width:100%;margin-top:8px">+ Add Property</button>

  <div id="addPropertyForm" style="display:none;margin-top:10px">
    <div class="field">
      <label>Property Name</label>
      <input id="p_propertyName" type="text" placeholder="e.g. Sunway Condo Unit 12-3">
    </div>
    <div class="field">
      <label>Address Line 1</label>
      <input id="p_addressLine1" type="text">
    </div>
    <div class="field-row">
      <div class="field">
        <label>City</label>
        <input id="p_addressCity" type="text">
      </div>
      <div class="field">
        <label>State</label>
        <input id="p_addressState" type="text">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Purchase Date</label>
        <input id="p_purchaseDate" type="date">
      </div>
      <div class="field">
        <label>Purchase Price (MYR)</label>
        <input id="p_purchasePrice" type="number" step="0.01" min="0">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Type</label>
        <select id="p_propertyType"></select>
      </div>
      <div class="field">
        <label>Tenure</label>
        <select id="p_freeholdLeasehold"></select>
      </div>
    </div>
    <details>
      <summary>More details</summary>
      <div class="field"><label>Developer</label><input id="p_developer" type="text"></div>
      <div class="field-row">
        <div class="field"><label>Address Line 2</label><input id="p_addressLine2" type="text"></div>
        <div class="field"><label>Postcode</label><input id="p_addressPostcode" type="text"></div>
      </div>
      <div class="field"><label>Country</label><input id="p_addressCountry" type="text" value="Malaysia"></div>
      <div class="field-row">
        <div class="field"><label>Built-up (sqft)</label><input id="p_builtUp" type="number" min="0"></div>
        <div class="field"><label>Land size (sqft)</label><input id="p_landSize" type="number" min="0"></div>
      </div>
      <div class="field"><label>Owner</label><input id="p_owner" type="text"></div>
    </details>
    <button class="btn" id="p_submit" style="width:100%">Save Property</button>
  </div>
</div>

<div id="view-history" class="view">
  <div class="search-box">
    <input id="historySearch" type="text" placeholder="Search payee, category, property…">
  </div>
  <div id="historyList"></div>
</div>

<div id="view-dlp" class="view">
  <div class="sub-tabs">
    <button class="sub-tab-btn active" data-dlpsub="overview">Overview</button>
    <button class="sub-tab-btn" data-dlpsub="list">Defects</button>
    <button class="sub-tab-btn" data-dlpsub="correspondence">Correspondence</button>
  </div>

  <div id="dlpSubOverview" class="dlp-sub active">
    <div id="dlpOverviewLoading" class="loading">Loading…</div>
    <div id="dlpOverviewContent" style="display:none"></div>
  </div>

  <div id="dlpSubList" class="dlp-sub">
    <div id="dlpListLoading" class="loading">Loading…</div>
    <div id="dlpListContent" style="display:none">
      <div class="dlp-table-wrap">
        <table class="dlp-table">
          <thead>
            <tr>
              <th>ItemID</th><th>Category</th><th>SubCategory</th><th>Description</th>
              <th>Remark</th><th>Location</th><th>Priority</th><th>Status</th>
              <th>Developer</th><th>Owner Verif.</th>
            </tr>
          </thead>
          <tbody id="dlpDefectRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="dlpSubCorrespondence" class="dlp-sub">
    <div id="dlpCorrespondenceLoading" class="loading">Loading…</div>
    <div id="dlpCorrespondenceContent" style="display:none"></div>
  </div>

  <div id="dlpSubDetail" class="dlp-sub">
    <span class="back-link" id="dlpBackToList">← Back to Defect List</span>
    <div id="dlpDetailLoading" class="loading">Loading…</div>
    <div id="dlpDetailContent" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var state = {
  properties: [],
  formOptions: null,
  currentPropertyFilter: '',
  dlp: {
    formOptions: null,
    defects: [],
    currentDefectId: null
  }
};

document.addEventListener('DOMContentLoaded', init);

function init() {
  setupTabs();
  setupPropertyFilter();
  setupAddBillForm();
  setupPropertiesView();
  setupHistoryView();
  setupDlpView();
  loadFormOptions();
  loadProperties();
  loadDashboard();
}

// ─── Console Page shell (UI Architecture Migration, Phase A) ──────
// ★ 2026-09-04 — Decision Lock §5 B/C/D/G. Generalizes the old
// per-tab if/else below into a declared page registry: each migrated
// page states its own onActivate + whether it reloads every time it's
// shown, instead of a hard-coded line in the click handler. This does
// NOT touch any existing render/data function — loadDlpTab, showDlpSub,
// renderDlp* etc. are called exactly as before, just from a registry
// entry instead of an inline `if`. Pages not yet registered here keep
// running through the untouched fallback path inside setupTabs() —
// see Decision Lock §6 (Sidebar Retirement Safety): Dashboard/Add
// Bill/Properties/History are deliberately left on that fallback path
// in this Phase A slice and are migration-deprecated, not migrated,
// pending a later, non-blocking step (Decision Lock §3 step 4).

var ConsolePages = {};

function registerConsolePage(id, config) {
  ConsolePages[id] = {
    onActivate: (config && config.onActivate) || function () {},
    reloadOnEveryActivation: !!(config && config.reloadOnEveryActivation),
    _loadedOnce: false
  };
}

function activateConsolePage(id) {
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.remove('active'); });
  document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
  var btn = document.querySelector('#tabs button[data-view="' + id + '"]');
  if (btn) btn.classList.add('active');
  var viewEl = document.getElementById('view-' + id);
  if (viewEl) viewEl.classList.add('active');

  var page = ConsolePages[id];
  if (page.reloadOnEveryActivation || !page._loadedOnce) {
    page.onActivate();
    page._loadedOnce = true;
  }
}

registerConsolePage('dlp', {
  onActivate: loadDlpTab,
  reloadOnEveryActivation: true   // matches the tab's pre-migration behaviour exactly: it re-fetched on every click, never cached
});

// ─── Tabs ────────────────────────────────────────────────────────

function setupTabs() {
  document.querySelectorAll('#tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var view = btn.dataset.view;
      if (ConsolePages[view]) {
        activateConsolePage(view);
        return;
      }
      // ── migration-deprecated path — unchanged from before Phase A ──
      document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('view-' + view).classList.add('active');
      if (view === 'history') loadHistory();
    });
  });
}

// ─── Property filter (shared across Dashboard/History) ───────────

function setupPropertyFilter() {
  document.getElementById('propertyFilter').addEventListener('change', function (e) {
    state.currentPropertyFilter = e.target.value;
    loadDashboard();
    if (document.getElementById('view-history').classList.contains('active')) loadHistory();
  });
}

function loadProperties() {
  google.script.run
    .withSuccessHandler(function (res) {
    if (!res.success) { showToast(res.error, true); return; }
    state.properties = res.data;
    var sel = document.getElementById('propertyFilter');
    var obSel = document.getElementById('ob_propertyId');
    sel.innerHTML = '<option value="">All Properties</option>';
    obSel.innerHTML = '';
    res.data.forEach(function (p) {
      var opt1 = document.createElement('option');
      opt1.value = p.PropertyID; opt1.textContent = p.PropertyName;
      sel.appendChild(opt1);
      var opt2 = opt1.cloneNode(true);
      obSel.appendChild(opt2);
    });
    renderPropertiesList();
    })
    .withFailureHandler(function (err) { showToast('Failed to load properties: ' + err.message, true); })
    .console_listProperties();
}

// ─── Dashboard ─────────────────────────────────────────────────────

function loadDashboard() {
  document.getElementById('dashboardLoading').style.display = 'block';
  document.getElementById('dashboardContent').style.display = 'none';
  google.script.run
    .withSuccessHandler(function (res) {
      document.getElementById('dashboardLoading').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
      if (!res.success) { showToast(res.error, true); return; }
      renderDashboard(res.data);
    })
    .withFailureHandler(function (err) {
      document.getElementById('dashboardLoading').style.display = 'none';
      showToast('Failed to load dashboard: ' + err.message, true);
    })
    .console_getDashboardSnapshot(state.currentPropertyFilter || null);
}

function renderDashboard(data) {
  renderOccurrenceList('overdueList', data.overdue, 'overdue', 'No overdue payments.');
  renderOccurrenceList('thisWeekList', data.dueThisWeek, 'upcoming', 'Nothing due this week.');
  renderOccurrenceList('upcomingList', data.dueUpcoming, 'upcoming', 'Nothing else due in the next 30 days.');
  renderOccurrenceList('recentPaymentsList', data.recentPayments, 'paid', 'No payments recorded yet.');

  document.getElementById('monthlyTotal').textContent = 'RM ' + formatAmount(data.monthlyExpense.total);
  var breakdown = Object.keys(data.monthlyExpense.byCategory).map(function (cat) {
    return cat + ': RM ' + formatAmount(data.monthlyExpense.byCategory[cat]);
  }).join(' · ');
  document.getElementById('monthlyBreakdown').textContent = breakdown || 'No expenses recorded this month yet.';
}

function renderOccurrenceList(containerId, items, kind, emptyText) {
  var container = document.getElementById(containerId);
  container.innerHTML = '';
  if (!items || items.length === 0) {
    container.innerHTML = '<div class="empty">' + emptyText + '</div>';
    return;
  }
  items.forEach(function (item) {
    var card = document.createElement('div');
    card.className = 'card ' + kind;
    var dateLabel = kind === 'paid' ? ('Paid ' + item.paidDate) : ('Due ' + item.effectiveDue);
    card.innerHTML =
      '<div class="card-row">' +
        '<div>' +
          '<div class="card-title">' + escapeHtml(item.category) + ' — ' + escapeHtml(item.payee) + '</div>' +
          '<div class="card-sub">' + escapeHtml(item.propertyName) + ' · ' + dateLabel + '</div>' +
        '</div>' +
        '<div class="card-amount">RM ' + formatAmount(kind === 'paid' ? item.paidAmount : item.expectedAmount) + '</div>' +
      '</div>';
    if (kind !== 'paid') {
      var payBtn = document.createElement('button');
      payBtn.className = 'btn small';
      payBtn.style.marginTop = '8px';
      payBtn.textContent = 'Pay';
      payBtn.addEventListener('click', function () { showPayForm(card, item); });
      card.appendChild(payBtn);
    }
    container.appendChild(card);
  });
}

function showPayForm(card, item) {
  if (card.querySelector('.pay-form')) return; // already open
  var existingBtn = card.querySelector('.btn');
  if (existingBtn) existingBtn.style.display = 'none';

  var form = document.createElement('div');
  form.className = 'pay-form';
  var today = new Date().toISOString().slice(0, 10);
  form.innerHTML =
    '<div><label>Amount</label><input type="number" step="0.01" class="pf-amount" value="' + item.expectedAmount + '"></div>' +
    '<div><label>Date</label><input type="date" class="pf-date" value="' + today + '"></div>';
  var confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn small';
  confirmBtn.textContent = 'Confirm';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn small secondary';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.style.marginLeft = '4px';

  confirmBtn.addEventListener('click', function () {
    confirmBtn.disabled = true;
    var amount = form.querySelector('.pf-amount').value;
    var date = form.querySelector('.pf-date').value;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { showToast(res.error, true); confirmBtn.disabled = false; return; }
        showToast('Payment recorded.');
        loadDashboard();
      })
      .withFailureHandler(function (err) { showToast(err.message, true); confirmBtn.disabled = false; })
      .console_recordPayment(item.occurrenceId, amount, date, '');
  });

  form.appendChild(confirmBtn);
  form.appendChild(cancelBtn);
  cancelBtn.addEventListener('click', function () {
    form.remove();
    if (existingBtn) existingBtn.style.display = '';
  });
  card.appendChild(form);
}

// ─── Add Bill ────────────────────────────────────────────────────

function setupAddBillForm() {
  document.getElementById('ob_frequencyType').addEventListener('change', function (e) {
    document.getElementById('ob_customIntervalField').style.display = e.target.value === 'Custom' ? 'block' : 'none';
  });
  document.getElementById('ob_submit').addEventListener('click', submitAddBill);
}

function submitAddBill() {
  var btn = document.getElementById('ob_submit');
  var input = {
    propertyId: document.getElementById('ob_propertyId').value,
    category: document.getElementById('ob_category').value,

// ─── Shared panel-state helpers (2026-09-01) ────────────────────────
// Real-device testing (CC) showed Overview loading blank with no
// visible error when dlp_getSidebarCaseDashboard's response was
// malformed/failed — the old code hid Loading and showed Content
// unconditionally, before checking res.success, so a bad response left
// the panel with no Loading text AND no rendered content: just blank.
// These three helpers make loading/error/content mutually exclusive and
// always visible for every DLP panel — repurposing each panel's
// existing "…Loading" div as a general status slot (shown for either
// "Loading…" or an error) rather than adding new DOM elements. Content
// divs are only ever populated on a real success, so a static skeleton
// (the Defect List's <table>) is never destroyed by an error the way it
// would be if the error were rendered into the content div itself.
function dlpSetPanelLoading_(id) {
  var loadingEl = document.getElementById(id + 'Loading');
  loadingEl.className = 'loading';
  loadingEl.style.color = '';
  loadingEl.textContent = 'Loading…';
  loadingEl.style.display = 'block';
  document.getElementById(id + 'Content').style.display = 'none';
}

function dlpSetPanelError_(id, message) {
  var loadingEl = document.getElementById(id + 'Loading');
  loadingEl.className = 'empty';
  loadingEl.style.color = '#c5221f';
  loadingEl.textContent = '⚠ ' + message;
  loadingEl.style.display = 'block';
  document.getElementById(id + 'Content').style.display = 'none';
}

function dlpSetPanelContent_(id) {
  document.getElementById(id + 'Loading').style.display = 'none';
  document.getElementById(id + 'Content').style.display = 'block';
}

// Handles both plain-object dlp_* responses and the JSON-stringified
// ones (dlp_getSidebarCaseDashboard, since 2026-09-01 — see 947's own
// comment for why that one specifically needs it) with one shared path,
// so every load function below gets the same defensive treatment
// whether or not its particular RPC happens to stringify.
function dlpParseResponse_(raw) {
  var res;
  try {
    res = (typeof raw === 'string') ? JSON.parse(raw) : raw;
  } catch (e) {
    return { ok: false, message: 'Could not parse the server response (' + e.message + ').' };
  }
  if (!res) return { ok: false, message: 'No response received from the server.' };
  if (!res.success) return { ok: false, message: res.error || 'Unknown error.' };
  return { ok: true, data: res.data };
}

      renderDlpCaseOverview(parsed.data);
      dlpSetPanelContent_('dlpOverview');
    })
    .withFailureHandler(function (err) {
      dlpSetPanelError_('dlpOverview', 'Failed to load Case Overview: ' + (err && err.message ? err.message : err));
    })

// compute all of it, wrapper passes it through untouched) — Correspondence
// now has its own sub-tab (below) with its own real data; the rest stay
// unsurfaced here since there's no matching Rectification Event/Secondary
// Damage case-wide view in this Contract, only per-defect ones on Detail.

  var c = dash.caseInfo;
  var dc = dash.defectCounts;
  var html = '<div class="detail-grid">' +
    dlpField('Property', c.propertyName + (c.unitLabel ? (' · ' + c.unitLabel) : '')) +
    dlpField('Case', c.caseTitle || c.caseId) +
    dlpField('Management Office', c.managementOffice) +
    dlpField('DLP Start', c.dlpStartDate) +
    dlpField('DLP End', c.dlpEndDate + (c.dlpEndDateIsEstimated ? ' (est.)' : '')) +
    dlpField('Case Status', c.status) +

    '</div>';

  html += '<h3>By Developer Status</h3><div class="summary-box">' + dlpCountsLine(dc.byDeveloperStatus) + '</div>';

function dlpCountsLine(counts) {
  var parts = Object.keys(counts).map(function (k) { return escapeHtml(k) + ': ' + counts[k]; });

function renderDlpDefectList(defects) {
  var tbody = document.getElementById('dlpDefectRows');

    tbody.innerHTML = '<tr><td colspan="10" class="empty">No defects found for this Case.</td></tr>';
    return;
  }
  defects.forEach(function (d) {
    var tr = document.createElement('tr');
    tr.dataset.defectId = d.defectId;
    tr.innerHTML =
      '<td title="' + escapeHtml(d.itemId) + '">' + escapeHtml(d.itemId || '—') + '</td>' +
      '<td title="' + escapeHtml(d.category) + '">' + escapeHtml(d.category) + '</td>' +
      '<td title="' + escapeHtml(d.subCategory) + '">' + escapeHtml(d.subCategory || '—') + '</td>' +
      '<td title="' + escapeHtml(d.description) + '">' + escapeHtml(d.description) + '</td>' +
      '<td title="' + escapeHtml(d.remark) + '">' + escapeHtml(d.remark || '—') + '</td>' +
      '<td title="' + escapeHtml(d.location) + '">' + escapeHtml(d.location) + '</td>' +
      '<td>' + escapeHtml(d.priority) + '</td>' +

function dlpBadge(value) {
  var cls = 'status-' + String(value || '').toLowerCase().replace(/[^a-z]/g, '');
  return '<span class="badge ' + cls + '">' + escapeHtml(value) + '</span>';
}

function dlpField(label, value) {
  var isEmpty = !value && value !== 0;
  return '<div class="detail-field"><span class="detail-label">' + escapeHtml(label) + '</span>' +
    '<span class="detail-value' + (isEmpty ? ' empty' : '') + '">' +
    (isEmpty ? '—' : escapeHtml(String(value))) + '</span></div>';
}

// 'AccessGranted' -> 'Access Granted'. Client-side mirror of 918's own
// humanizeEventType_ — display-only, no behavior riding on it.
function humanizeDlpEnum_(value) {
  return String(value || '').replace(/([A-Z])/g, ' $1').trim();
}

    entryTime: document.getElementById('dlp_rectEntryTime').value || '',
    exitTime: document.getElementById('dlp_rectExitTime').value || '',
    notes: document.getElementById('dlp_rectNotes').value || ''
  };
  var dateVal = document.getElementById('dlp_rectDate').value;
  if (dateVal) input.eventDate = dateVal;
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.error, true); return; }
      showToast('Rectification event added.');
      openDlpDefectDetail(defectId);
    })
    .withFailureHandler(function (err) { btn.disabled = false; showToast(err.message, true); })
    .dlp_addRectificationEvent(input);
}

// ─── Evidence (2026-08-31, continued — vertical slice 2) ─────────────

function renderDlpEvidenceSection_(evidence) {
  var html = '<h3>Evidence</h3>';
  if (!evidence || evidence.length === 0) {
    html += '<div class="empty">No evidence attached yet.</div>';
  } else {
    evidence.forEach(function (e) {
      var driveUrl = 'https://drive.google.com/file/d/' + encodeURIComponent(e.driveFileId) + '/view';
      html += '<div class="detail-grid">' +
        dlpField('Type', e.evidenceType) +
        dlpField('Phase', e.phase) +
        dlpField('Description', e.description) +
        dlpField('Captured', e.capturedAt) +
        dlpField('Uploaded', e.uploadedAt) +
        '<div class="detail-field"><span class="detail-label">File</span><span class="detail-value"><a href="' +
        driveUrl + '" target="_blank" rel="noopener">View File →</a></span></div>' +
        '</div>';
    });
  }
  html += '<details><summary>+ Add Evidence</summary><div class="detail-grid">' +
    '<div class="field"><label>Evidence Type</label><select id="dlp_evidenceType"></select></div>' +
    '<div class="field"><label>Phase</label><select id="dlp_evidencePhase"></select></div>' +
    '<div class="field"><label>Description (optional)</label><textarea id="dlp_evidenceDescription" rows="2"></textarea></div>' +
    '<div class="field"><label>File</label><input id="dlp_evidenceFile" type="file" accept="image/*,application/pdf,.doc,.docx"></div>' +
    '<button class="btn" id="dlp_evidenceSubmit" style="width:100%">Upload Evidence</button>' +
    '</div></details>';
  return html;
}

// Mirrors 948_MobileConsole.html's own FileReader->base64 pattern
// exactly (same reader.result.split(',')[1] to strip the data URL
// prefix), so the client-side half of the upload path is proven
// against the one already confirmed working real-device.
function submitDlpAddEvidence(defectId) {
  var btn = document.getElementById('dlp_evidenceSubmit');
  var fileInput = document.getElementById('dlp_evidenceFile');
  var file = fileInput.files && fileInput.files[0];
  if (!file) { showToast('Choose a file first.', true); return; }

  var evidenceType = document.getElementById('dlp_evidenceType').value;
  var phase = document.getElementById('dlp_evidencePhase').value;
  var description = document.getElementById('dlp_evidenceDescription').value || '';

  btn.disabled = true;
  var reader = new FileReader();
  reader.onload = function () {
    var base64Data = reader.result.split(',')[1];
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        if (!res.success) { showToast(res.error, true); return; }
        showToast('Evidence uploaded.');
        openDlpDefectDetail(defectId);
      })
      .withFailureHandler(function (err) { btn.disabled = false; showToast(err.message, true); })
      .dlp_attachDefectEvidence({
        defectId: defectId,
        evidenceType: evidenceType,
        phase: phase,
        description: description,
        base64Data: base64Data,
        fileName: file.name,
        mimeType: file.type
      });
  };
  reader.onerror = function () {
    btn.disabled = false;
    showToast('Failed to read the selected file.', true);
  };
  reader.readAsDataURL(file);
}

// ─── Secondary Damage (2026-08-31, continued — vertical slice 2) ─────

function renderDlpSecondaryDamageSection_(damages) {
  var html = '<h3>Secondary Damage</h3>';
  if (!damages || damages.length === 0) {
    html += '<div class="empty">No secondary damage recorded yet.</div>';
  } else {
    damages.forEach(function (d) {
      html += '<div class="detail-grid">' +
        dlpField('Type', d.damageType) +
        dlpField('Description', d.description) +
        dlpField('Observed', d.observedDate + (d.observedBy ? (' by ' + d.observedBy) : '')) +
        '<div class="detail-field"><span class="detail-label">Status</span><span class="detail-value">' + dlpBadge(d.status) + '</span></div>' +
        dlpField('Responsible Party', d.responsibleParty) +
        dlpField('Admin. Submission Required', d.administrativeSubmissionRequired ? 'Yes' : 'No') +
        dlpField('DLP Prejudice Status', d.dlpPrejudiceStatus) +
        dlpField('Contractual Basis', d.contractualBasis) +
        '</div>';
    });
  }
  html += '<details><summary>+ Add Secondary Damage</summary><div class="detail-grid">' +
    '<div class="field"><label>Damage Type</label><select id="dlp_damageType"></select></div>' +
    '<div class="field"><label>Description</label><textarea id="dlp_damageDescription" rows="2"></textarea></div>' +
    '<div class="field"><label>Observed Date (optional — defaults to now)</label><input id="dlp_damageObservedDate" type="date"></div>' +
    '<div class="field"><label>Observed By (optional)</label><input id="dlp_damageObservedBy" type="text"></div>' +
    '<div class="field"><label>Responsible Party (optional)</label><input id="dlp_damageResponsibleParty" type="text">' +
    '<small style="color:#9aa0a6;">Free text — not a legal determination (901 schema\'s own framing).</small></div>' +
    '<div class="field"><label><input id="dlp_damageAdminSubmission" type="checkbox" style="width:auto;display:inline-block;vertical-align:middle"> Administrative Submission Required</label></div>' +
    '<div class="field"><label>DLP Prejudice Status (optional)</label><input id="dlp_damagePrejudiceStatus" type="text">' +
    '<small style="color:#9aa0a6;">Free text — neutral tag only, same framing as Responsible Party.</small></div>' +
    '<div class="field"><label>Contractual Basis (optional)</label><input id="dlp_damageContractualBasis" type="text"></div>' +
    '<button class="btn" id="dlp_damageSubmit" style="width:100%">Add Secondary Damage</button>' +
    '</div></details>';
  return html;
}

function submitDlpAddSecondaryDamage(defectId) {
  var btn = document.getElementById('dlp_damageSubmit');
  var input = {
    defectId: defectId,
    damageType: document.getElementById('dlp_damageType').value,
    description: document.getElementById('dlp_damageDescription').value,
    observedBy: document.getElementById('dlp_damageObservedBy').value || '',
    responsibleParty: document.getElementById('dlp_damageResponsibleParty').value || '',
    administrativeSubmissionRequired: document.getElementById('dlp_damageAdminSubmission').checked,
    dlpPrejudiceStatus: document.getElementById('dlp_damagePrejudiceStatus').value || '',
    contractualBasis: document.getElementById('dlp_damageContractualBasis').value || ''
  };
  var dateVal = document.getElementById('dlp_damageObservedDate').value;
  if (dateVal) input.observedDate = dateVal;
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.error, true); return; }
      showToast('Secondary damage recorded.');
      openDlpDefectDetail(defectId);
    })
    .withFailureHandler(function (err) { btn.disabled = false; showToast(err.message, true); })
    .dlp_addSecondaryDamage(input);
}

// ─── Correspondence (2026-08-31, continued — vertical slice 2) ───────
// View-only (Contract §1/§10 — see 922/947's own comments on this).

function loadDlpCorrespondence() {
  dlpSetPanelLoading_('dlpCorrespondence');
  google.script.run
    .withSuccessHandler(function (raw) {
      var parsed = dlpParseResponse_(raw);
      if (!parsed.ok) { dlpSetPanelError_('dlpCorrespondence', parsed.message); return; }
      renderDlpCorrespondence(parsed.data);
      dlpSetPanelContent_('dlpCorrespondence');
    })
    .withFailureHandler(function (err) {
      dlpSetPanelError_('dlpCorrespondence', 'Failed to load Correspondence: ' + (err && err.message ? err.message : err));
    })
    .dlp_listSidebarCorrespondence();
}

function renderDlpCorrespondence(items) {
  var el = document.getElementById('dlpCorrespondenceContent');
  if (!items || items.length === 0) {
    el.innerHTML = '<div class="empty">No correspondence recorded for this Case.</div>';
    return;
  }
  var html = '';
  items.forEach(function (c) {
    html += '<div class="detail-grid">' +
      dlpField('Date', c.date) +
      dlpField('Direction', c.direction) +
      dlpField('Subject', c.subject) +
      dlpField('Sender', c.sender) +
      dlpField('Recipient', c.recipient) +
      '<div class="detail-field"><span class="detail-label">Response Status</span><span class="detail-value">' + dlpBadge(c.responseStatus) + '</span></div>' +
      dlpField('Response Due', c.responseDueDate) +
      dlpField('Response Received', c.responseReceivedDate) +
      '</div>';
  });
  el.innerHTML = html;
}

// ─── Utilities ─────────────────────────────────────────────────────

function formatAmount(n) {
  n = Number(n) || 0;
  return n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(s) {
  var div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

var toastTimer;
function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
</script>
