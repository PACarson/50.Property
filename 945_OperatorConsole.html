<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
    color: #202124;
    margin: 0;
    padding: 0;
    background: #f8f9fa;
  }
  #tabs {
    display: flex;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #tabs button {
    flex: 1;
    padding: 10px 4px;
    border: none;
    background: none;
    font-size: 12px;
    color: #5f6368;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  #tabs button.active {
    color: #1a73e8;
    border-bottom-color: #1a73e8;
    font-weight: 600;
  }
  #propertyFilterBar {
    padding: 8px 10px;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
  }
  select, input, textarea {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
  }
  .view { display: none; padding: 10px; }
  .view.active { display: block; }
  section { margin-bottom: 14px; }
  h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #5f6368;
    margin: 0 0 6px 2px;
  }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 6px;
  }
  .card.overdue { border-left: 3px solid #d93025; }
  .card.upcoming { border-left: 3px solid #1a73e8; }
  .card.paid { border-left: 3px solid #188038; opacity: .85; }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-weight: 600; }
  .card-sub { color: #5f6368; font-size: 12px; margin-top: 2px; }
  .card-amount { font-weight: 600; white-space: nowrap; margin-left: 8px; }
  .btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #1a73e8;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn.secondary { background: #f1f3f4; color: #202124; }
  .btn.small { padding: 4px 10px; font-size: 11px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .pay-form {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #dadce0;
    display: flex;
    gap: 6px;
    align-items: flex-end;
  }
  .pay-form > div { flex: 1; }
  .pay-form label { display: block; font-size: 10px; color: #5f6368; margin-bottom: 2px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 3px; }
  .field-row { display: flex; gap: 8px; }
  .field-row > .field { flex: 1; }
  details { margin-bottom: 10px; }
  details summary { font-size: 12px; color: #1a73e8; cursor: pointer; padding: 4px 0; }
  .empty { color: #9aa0a6; font-size: 12px; padding: 8px 2px; }
  .toast {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    background: #202124;
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    z-index: 100;
    display: none;
  }
  .toast.error { background: #d93025; }
  .summary-box {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
  }
  .summary-total { font-size: 20px; font-weight: 700; }
  .summary-breakdown { font-size: 11px; color: #5f6368; margin-top: 4px; }
  .loading { text-align: center; color: #9aa0a6; padding: 20px; font-size: 12px; }
  .search-box { margin-bottom: 8px; }

  /* ── DLP Tab (Sidebar Phase 1, 2026-08-31) ───────────────────────── */
  .sub-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .sub-tab-btn {
    padding: 5px 10px;
    border: 1px solid #dadce0;
    border-radius: 14px;
    background: #fff;
    color: #5f6368;
    font-size: 11px;
    cursor: pointer;
  }
  .sub-tab-btn.active { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 600; }
  .dlp-sub { display: none; }
  .dlp-sub.active { display: block; }
  .back-link { display: inline-block; color: #1a73e8; font-size: 12px; cursor: pointer; margin-bottom: 10px; }
  .dlp-table-wrap { overflow-x: auto; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
  table.dlp-table { border-collapse: collapse; width: 100%; font-size: 11px; }
  table.dlp-table th, table.dlp-table td {
    padding: 6px 8px;
    text-align: left;
    border-bottom: 1px solid #f1f3f4;
    white-space: nowrap;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  table.dlp-table th {
    position: sticky; top: 0;
    background: #f8f9fa;
    color: #5f6368;
    text-transform: uppercase;
    letter-spacing: .03em;
    font-size: 10px;
  }
  table.dlp-table th:first-child, table.dlp-table td:first-child {
    position: sticky; left: 0;
    background: #fff;
    font-weight: 600;
    box-shadow: 1px 0 0 #f1f3f4;
  }
  table.dlp-table th:first-child { background: #f8f9fa; }
  table.dlp-table tbody tr { cursor: pointer; }
  table.dlp-table tbody tr:hover td { background: #f8f9fa; }
  table.dlp-table tbody tr:hover td:first-child { background: #f1f7fe; }
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    background: #f1f3f4;
    color: #5f6368;
  }
  .badge.status-open, .badge.status-pending, .badge.status-notchecked { background: #fce8e6; color: #c5221f; }
  .badge.status-inprogress, .badge.status-scheduled, .badge.status-partiallyverified { background: #fef7e0; color: #b06000; }
  .badge.status-pendingverification, .badge.status-claimedcompleted { background: #e8f0fe; color: #1a73e8; }
  .badge.status-verified, .badge.status-closed { background: #e6f4ea; color: #188038; }
  .badge.status-failedverification { background: #fce8e6; color: #c5221f; }
  .detail-grid { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .detail-field { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid #f8f9fa; font-size: 12px; }
  .detail-field:last-child { border-bottom: none; }
  .detail-label { color: #5f6368; flex-shrink: 0; }
  .detail-value { text-align: right; word-break: break-word; }
  .detail-value.empty { color: #bdc1c6; }
</style>
</head>
<body>

<nav id="tabs">
  <button data-view="dashboard" class="active">Dashboard</button>
  <button data-view="addBill">Add Bill</button>
  <button data-view="properties">Properties</button>
  <button data-view="history">History</button>
  <button data-view="dlp">DLP</button>
</nav>

<div id="propertyFilterBar">
  <select id="propertyFilter"><option value="">All Properties</option></select>
</div>

<div id="view-dashboard" class="view active">
  <div id="dashboardLoading" class="loading">Loading…</div>
  <div id="dashboardContent" style="display:none">
    <section>
      <h3>Overdue</h3>
      <div id="overdueList"></div>
    </section>
    <section>
      <h3>Due This Week</h3>
      <div id="thisWeekList"></div>
    </section>
    <section>
      <h3>Upcoming (30 days)</h3>
      <div id="upcomingList"></div>
    </section>
    <section>
      <h3>This Month</h3>
      <div class="summary-box">
        <div class="summary-total" id="monthlyTotal">—</div>
        <div class="summary-breakdown" id="monthlyBreakdown"></div>
      </div>
    </section>
    <section>
      <h3>Recent Payments</h3>
      <div id="recentPaymentsList"></div>
    </section>
  </div>
</div>

<div id="view-addBill" class="view">
  <div class="field">
    <label>Property</label>
    <select id="ob_propertyId"></select>
  </div>
  <div class="field">
    <label>Category</label>
    <select id="ob_category"></select>
  </div>
  <div class="field">
    <label>Payee</label>
    <input id="ob_payee" type="text" placeholder="e.g. Maybank, TNB, Air Selangor">
  </div>
  <div class="field-row">
    <div class="field">
      <label>Amount (MYR)</label>
      <input id="ob_amount" type="number" step="0.01" min="0">
    </div>
    <div class="field">
      <label>Frequency</label>
      <select id="ob_frequencyType"></select>
    </div>
  </div>
  <div class="field" id="ob_customIntervalField" style="display:none">
    <label>Custom interval (days)</label>
    <input id="ob_customIntervalDays" type="number" min="1">
  </div>
  <div class="field">
    <label>First due date</label>
    <input id="ob_dueAnchor" type="date">
  </div>
  <details>
    <summary>More options</summary>
    <div class="field">
      <label>Grace days (default 0)</label>
      <input id="ob_graceDays" type="number" min="0" value="0">
    </div>
    <div class="field">
      <label>End date (optional — leave blank if ongoing)</label>
      <input id="ob_endDate" type="date">
    </div>
    <div class="field">
      <label><input id="ob_autoGenerate" type="checkbox" checked style="width:auto;display:inline-block;vertical-align:middle"> Auto-generate next cycle after payment</label>
    </div>
  </details>
  <button class="btn" id="ob_submit" style="width:100%">Add Bill</button>
</div>

<div id="view-properties" class="view">
  <div id="propertiesList"></div>
  <button class="btn secondary" id="showAddPropertyBtn" style="width:100%;margin-top:8px">+ Add Property</button>

  <div id="addPropertyForm" style="display:none;margin-top:10px">
    <div class="field">
      <label>Property Name</label>
      <input id="p_propertyName" type="text" placeholder="e.g. Sunway Condo Unit 12-3">
    </div>
    <div class="field">
      <label>Address Line 1</label>
      <input id="p_addressLine1" type="text">
    </div>
    <div class="field-row">
      <div class="field">
        <label>City</label>
        <input id="p_addressCity" type="text">
      </div>
      <div class="field">
        <label>State</label>
        <input id="p_addressState" type="text">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Purchase Date</label>
        <input id="p_purchaseDate" type="date">
      </div>
      <div class="field">
        <label>Purchase Price (MYR)</label>
        <input id="p_purchasePrice" type="number" step="0.01" min="0">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Type</label>
        <select id="p_propertyType"></select>
      </div>
      <div class="field">
        <label>Tenure</label>
        <select id="p_freeholdLeasehold"></select>
      </div>
    </div>
    <details>
      <summary>More details</summary>
      <div class="field"><label>Developer</label><input id="p_developer" type="text"></div>
      <div class="field-row">
        <div class="field"><label>Address Line 2</label><input id="p_addressLine2" type="text"></div>
        <div class="field"><label>Postcode</label><input id="p_addressPostcode" type="text"></div>
      </div>
      <div class="field"><label>Country</label><input id="p_addressCountry" type="text" value="Malaysia"></div>
      <div class="field-row">
        <div class="field"><label>Built-up (sqft)</label><input id="p_builtUp" type="number" min="0"></div>
        <div class="field"><label>Land size (sqft)</label><input id="p_landSize" type="number" min="0"></div>
      </div>
      <div class="field"><label>Owner</label><input id="p_owner" type="text"></div>
    </details>
    <button class="btn" id="p_submit" style="width:100%">Save Property</button>
  </div>
</div>

<div id="view-history" class="view">
  <div class="search-box">
    <input id="historySearch" type="text" placeholder="Search payee, category, property…">
  </div>
  <div id="historyList"></div>
</div>

<div id="view-dlp" class="view">
  <div class="sub-tabs">
    <button class="sub-tab-btn active" data-dlpsub="overview">Overview</button>
    <button class="sub-tab-btn" data-dlpsub="list">Defects</button>
  </div>

  <div id="dlpSubOverview" class="dlp-sub active">
    <div id="dlpOverviewLoading" class="loading">Loading…</div>
    <div id="dlpOverviewContent" style="display:none"></div>
  </div>

  <div id="dlpSubList" class="dlp-sub">
    <div id="dlpListLoading" class="loading">Loading…</div>
    <div id="dlpListContent" style="display:none">
      <div class="dlp-table-wrap">
        <table class="dlp-table">
          <thead>
            <tr>
              <th>ItemID</th><th>Category</th><th>SubCategory</th><th>Description</th>
              <th>Remark</th><th>Location</th><th>Priority</th><th>Status</th>
              <th>Developer</th><th>Owner Verif.</th>
            </tr>
          </thead>
          <tbody id="dlpDefectRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="dlpSubDetail" class="dlp-sub">
    <span class="back-link" id="dlpBackToList">← Back to Defect List</span>
    <div id="dlpDetailLoading" class="loading">Loading…</div>
    <div id="dlpDetailContent" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var state = {
  properties: [],
  formOptions: null,
  currentPropertyFilter: '',
  dlp: {
    formOptions: null,
    defects: [],
    currentDefectId: null
  }
};

document.addEventListener('DOMContentLoaded', init);

function init() {
  setupTabs();
  setupPropertyFilter();
  setupAddBillForm();
  setupPropertiesView();
  setupHistoryView();
  setupDlpView();
  loadFormOptions();
  loadProperties();
  loadDashboard();
}

// ─── Tabs ────────────────────────────────────────────────────────

function setupTabs() {
  document.querySelectorAll('#tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
      if (btn.dataset.view === 'history') loadHistory();
      if (btn.dataset.view === 'dlp') loadDlpTab();
    });
  });
}

// ─── Property filter (shared across Dashboard/History) ───────────

function setupPropertyFilter() {
  document.getElementById('propertyFilter').addEventListener('change', function (e) {
    state.currentPropertyFilter = e.target.value;
    loadDashboard();
    if (document.getElementById('view-history').classList.contains('active')) loadHistory();
  });
}

function loadProperties() {
  google.script.run
    .withSuccessHandler(function (res) {
    if (!res.success) { showToast(res.error, true); return; }
    state.properties = res.data;
    var sel = document.getElementById('propertyFilter');
    var obSel = document.getElementById('ob_propertyId');
    sel.innerHTML = '<option value="">All Properties</option>';
    obSel.innerHTML = '';
    res.data.forEach(function (p) {
      var opt1 = document.createElement('option');
      opt1.value = p.PropertyID; opt1.textContent = p.PropertyName;
      sel.appendChild(opt1);
      var opt2 = opt1.cloneNode(true);
      obSel.appendChild(opt2);
    });
    renderPropertiesList();
    })
    .withFailureHandler(function (err) { showToast('Failed to load properties: ' + err.message, true); })
    .console_listProperties();
}

// ─── Dashboard ─────────────────────────────────────────────────────

function loadDashboard() {
  document.getElementById('dashboardLoading').style.display = 'block';
  document.getElementById('dashboardContent').style.display = 'none';
  google.script.run
    .withSuccessHandler(function (res) {
      document.getElementById('dashboardLoading').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
      if (!res.success) { showToast(res.error, true); return; }
      renderDashboard(res.data);
    })
    .withFailureHandler(function (err) {
      document.getElementById('dashboardLoading').style.display = 'none';
      showToast('Failed to load dashboard: ' + err.message, true);
    })
    .console_getDashboardSnapshot(state.currentPropertyFilter || null);
}

function renderDashboard(data) {
  renderOccurrenceList('overdueList', data.overdue, 'overdue', 'No overdue payments.');
  renderOccurrenceList('thisWeekList', data.dueThisWeek, 'upcoming', 'Nothing due this week.');
  renderOccurrenceList('upcomingList', data.dueUpcoming, 'upcoming', 'Nothing else due in the next 30 days.');
  renderOccurrenceList('recentPaymentsList', data.recentPayments, 'paid', 'No payments recorded yet.');

  document.getElementById('monthlyTotal').textContent = 'RM ' + formatAmount(data.monthlyExpense.total);
  var breakdown = Object.keys(data.monthlyExpense.byCategory).map(function (cat) {
    return cat + ': RM ' + formatAmount(data.monthlyExpense.byCategory[cat]);
  }).join(' · ');
  document.getElementById('monthlyBreakdown').textContent = breakdown || 'No expenses recorded this month yet.';
}

function renderOccurrenceList(containerId, items, kind, emptyText) {
  var container = document.getElementById(containerId);
  container.innerHTML = '';
  if (!items || items.length === 0) {
    container.innerHTML = '<div class="empty">' + emptyText + '</div>';
    return;
  }
  items.forEach(function (item) {
    var card = document.createElement('div');
    card.className = 'card ' + kind;
    var dateLabel = kind === 'paid' ? ('Paid ' + item.paidDate) : ('Due ' + item.effectiveDue);
    card.innerHTML =
      '<div class="card-row">' +
        '<div>' +
          '<div class="card-title">' + escapeHtml(item.category) + ' — ' + escapeHtml(item.payee) + '</div>' +
          '<div class="card-sub">' + escapeHtml(item.propertyName) + ' · ' + dateLabel + '</div>' +
        '</div>' +
        '<div class="card-amount">RM ' + formatAmount(kind === 'paid' ? item.paidAmount : item.expectedAmount) + '</div>' +
      '</div>';
    if (kind !== 'paid') {
      var payBtn = document.createElement('button');
      payBtn.className = 'btn small';
      payBtn.style.marginTop = '8px';
      payBtn.textContent = 'Pay';
      payBtn.addEventListener('click', function () { showPayForm(card, item); });
      card.appendChild(payBtn);
    }
    container.appendChild(card);
  });
}

function showPayForm(card, item) {
  if (card.querySelector('.pay-form')) return; // already open
  var existingBtn = card.querySelector('.btn');
  if (existingBtn) existingBtn.style.display = 'none';

  var form = document.createElement('div');
  form.className = 'pay-form';
  var today = new Date().toISOString().slice(0, 10);
  form.innerHTML =
    '<div><label>Amount</label><input type="number" step="0.01" class="pf-amount" value="' + item.expectedAmount + '"></div>' +
    '<div><label>Date</label><input type="date" class="pf-date" value="' + today + '"></div>';
  var confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn small';
  confirmBtn.textContent = 'Confirm';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn small secondary';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.style.marginLeft = '4px';

  confirmBtn.addEventListener('click', function () {
    confirmBtn.disabled = true;
    var amount = form.querySelector('.pf-amount').value;
    var date = form.querySelector('.pf-date').value;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { showToast(res.error, true); confirmBtn.disabled = false; return; }
        showToast('Payment recorded.');
        loadDashboard();
      })
      .withFailureHandler(function (err) { showToast(err.message, true); confirmBtn.disabled = false; })
      .console_recordPayment(item.occurrenceId, amount, date, '');
  });

  form.appendChild(confirmBtn);
  form.appendChild(cancelBtn);
  cancelBtn.addEventListener('click', function () {
    form.remove();
    if (existingBtn) existingBtn.style.display = '';
  });
  card.appendChild(form);
}

// ─── Add Bill ────────────────────────────────────────────────────

function setupAddBillForm() {
  document.getElementById('ob_frequencyType').addEventListener('change', function (e) {
    document.getElementById('ob_customIntervalField').style.display = e.target.value === 'Custom' ? 'block' : 'none';
  });
  document.getElementById('ob_submit').addEventListener('click', submitAddBill);
}

function submitAddBill() {
  var btn = document.getElementById('ob_submit');
  var input = {
    propertyId: document.getElementById('ob_propertyId').value,
    category: document.getElementById('ob_category').value,
    payee: document.getElementById('ob_payee').value,
    amount: Number(document.getElementById('ob_amount').value),
    frequencyType: document.getElementById('ob_frequencyType').value,
    dueAnchor: document.getElementById('ob_dueAnchor').value,
    graceDays: Number(document.getElementById('ob_graceDays').value || 0),
    autoGenerate: document.getElementById('ob_autoGenerate').checked
  };
  var customDays = document.getElementById('ob_customIntervalDays').value;
  if (input.frequencyType === 'Custom' && customDays) input.customIntervalDays = Number(customDays);
  var endDate = document.getElementById('ob_endDate').value;
  if (endDate) input.endDate = endDate;

  if (!input.propertyId || !input.category || !input.payee || !input.amount || !input.dueAnchor) {
    showToast('Please fill in Property, Category, Payee, Amount, and Due Date.', true);
    return;
  }

  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.error, true); return; }
      showToast('Bill added.');
      document.getElementById('ob_payee').value = '';
      document.getElementById('ob_amount').value = '';
      loadDashboard();
    })
    .withFailureHandler(function (err) { btn.disabled = false; showToast(err.message, true); })
    .console_createObligation(input);
}

// ─── Properties ────────────────────────────────────────────────────

function setupPropertiesView() {
  document.getElementById('showAddPropertyBtn').addEventListener('click', function () {
    var form = document.getElementById('addPropertyForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('p_submit').addEventListener('click', submitAddProperty);
}

function renderPropertiesList() {
  var container = document.getElementById('propertiesList');
  container.innerHTML = '';
  if (state.properties.length === 0) {
    container.innerHTML = '<div class="empty">No properties yet — add one below.</div>';
    return;
  }
  state.properties.forEach(function (p) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-title">' + escapeHtml(p.PropertyName) + '</div>' +
      '<div class="card-sub">' + escapeHtml(p.AddressLine1) + (p.AddressCity ? ', ' + escapeHtml(p.AddressCity) : '') + '</div>' +
      '<div class="card-sub">' + escapeHtml(p.PropertyType) + ' · ' + escapeHtml(p.FreeholdLeasehold) + '</div>';
    container.appendChild(card);
  });
}

function submitAddProperty() {
  var btn = document.getElementById('p_submit');
  var input = {
    propertyName: document.getElementById('p_propertyName').value,
    addressLine1: document.getElementById('p_addressLine1').value,
    addressLine2: document.getElementById('p_addressLine2').value,
    addressCity: document.getElementById('p_addressCity').value,
    addressState: document.getElementById('p_addressState').value,
    addressPostcode: document.getElementById('p_addressPostcode').value,
    addressCountry: document.getElementById('p_addressCountry').value || 'Malaysia',
    purchaseDate: document.getElementById('p_purchaseDate').value,
    purchasePrice: Number(document.getElementById('p_purchasePrice').value),
    freeholdLeasehold: document.getElementById('p_freeholdLeasehold').value,
    propertyType: document.getElementById('p_propertyType').value,
    developer: document.getElementById('p_developer').value,
    builtUp: document.getElementById('p_builtUp').value ? Number(document.getElementById('p_builtUp').value) : undefined,
    landSize: document.getElementById('p_landSize').value ? Number(document.getElementById('p_landSize').value) : undefined,
    owner: document.getElementById('p_owner').value
  };

  if (!input.propertyName || !input.addressLine1 || !input.purchaseDate || !input.purchasePrice) {
    showToast('Please fill in Name, Address, Purchase Date, and Price.', true);
    return;
  }

  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.error, true); return; }
      showToast('Property added.');
      document.getElementById('addPropertyForm').style.display = 'none';
      loadProperties();
    })
    .withFailureHandler(function (err) { btn.disabled = false; showToast(err.message, true); })
    .console_createProperty(input);
}

// ─── History ───────────────────────────────────────────────────────

function setupHistoryView() {
  var debounceTimer;
  document.getElementById('historySearch').addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadHistory, 300);
  });
}

function loadHistory() {
  var search = document.getElementById('historySearch').value;
  document.getElementById('historyList').innerHTML = '<div class="loading">Loading…</div>';
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { showToast(res.error, true); return; }
      renderOccurrenceList('historyList', res.data, 'paid', 'No matching payments found.');
    })
    .withFailureHandler(function (err) { showToast(err.message, true); })
    .console_getPaymentHistory(state.currentPropertyFilter || null, search);
}

// ─── Form options (dropdowns) ─────────────────────────────────────

function loadFormOptions() {
  google.script.run
    .withSuccessHandler(function (opts) {
      state.formOptions = opts;
      fillSelect('ob_category', opts.categories);
      fillSelect('ob_frequencyType', opts.frequencyTypes);
      fillSelect('p_propertyType', opts.propertyTypes);
      fillSelect('p_freeholdLeasehold', opts.freeholdLeaseholdOptions);
    })
    .withFailureHandler(function (err) { showToast('Failed to load form options: ' + err.message, true); })
    .console_getFormOptions();
}

function fillSelect(id, values) {
  var sel = document.getElementById(id);
  sel.innerHTML = '';
  values.forEach(function (v) {
    var opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

// ─── DLP Tab (Sidebar Phase 1, 2026-08-31) ──────────────────────────
// Case Overview / Defect List / Defect Detail + Update Developer Status
// + Record Owner Verification only, per this round's vertical slice.
// Rectification Event / Evidence / Secondary Damage / Correspondence
// are not yet built — next round, per Contract §1/§2 and CC's pacing.

function setupDlpView() {
  document.querySelectorAll('.sub-tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { showDlpSub(btn.dataset.dlpsub); });
  });
  document.getElementById('dlpBackToList').addEventListener('click', function () {
    showDlpSub('list');
  });
}

function showDlpSub(name) {
  document.querySelectorAll('.dlp-sub').forEach(function (el) { el.classList.remove('active'); });
  var panelId = 'dlpSub' + name.charAt(0).toUpperCase() + name.slice(1);
  document.getElementById(panelId).classList.add('active');
  // Detail is a drill-down from List, not its own top-level sub-tab —
  // keep "Defects" looking active while viewing it.
  var activeSubTab = (name === 'detail') ? 'list' : name;
  document.querySelectorAll('.sub-tab-btn').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.dlpsub === activeSubTab);
  });
}

function loadDlpTab() {
  if (!state.dlp.formOptions) loadDlpFormOptions();
  loadDlpCaseOverview();
  loadDlpDefectList();
}

function loadDlpFormOptions() {
  google.script.run
    .withSuccessHandler(function (opts) { state.dlp.formOptions = opts; })
    .withFailureHandler(function (err) { showToast('Failed to load DLP form options: ' + err.message, true); })
    .dlp_getSidebarFormOptions();
}

// ─── Case Overview ───────────────────────────────────────────────

function loadDlpCaseOverview() {
  document.getElementById('dlpOverviewLoading').style.display = 'block';
  document.getElementById('dlpOverviewContent').style.display = 'none';
  google.script.run
    .withSuccessHandler(function (res) {
      document.getElementById('dlpOverviewLoading').style.display = 'none';
      document.getElementById('dlpOverviewContent').style.display = 'block';
      if (!res.success) { showToast(res.error, true); return; }
      renderDlpCaseOverview(res.data);
    })
    .withFailureHandler(function (err) {
      document.getElementById('dlpOverviewLoading').style.display = 'none';
      showToast('Failed to load Case Overview: ' + err.message, true);
    })
    .dlp_getSidebarCaseDashboard();
}

// Deliberately renders caseInfo + defectCounts only. getDlpCaseDashboard
// also returns secondaryDamageCount/correspondence/upcomingRectification/
// upcomingReinspection/lastChecked/recentTimeline (918/922 already
// compute all of it, wrapper passes it through untouched) — but
// Rectification Event/Evidence/Secondary Damage/Correspondence UI is
// next round's work, so this round's Overview doesn't surface summaries
// of domains it can't yet let CC act on.
function renderDlpCaseOverview(dash) {
  var c = dash.caseInfo;
  var dc = dash.defectCounts;
  var html = '<div class="detail-grid">' +
    dlpField('Property', c.propertyName + (c.unitLabel ? (' · ' + c.unitLabel) : '')) +
    dlpField('Case', c.caseTitle || c.caseId) +
    dlpField('Management Office', c.managementOffice) +
    dlpField('DLP Start', c.dlpStartDate) +
    dlpField('DLP End', c.dlpEndDate + (c.dlpEndDateIsEstimated ? ' (est.)' : '')) +
    dlpField('Case Status', c.status) +
    dlpField('Defects', dc.total + ' total (' + c.originalDefectCount + ' original)') +
    '</div>';

  html += '<h3>By Status</h3><div class="summary-box">' + dlpCountsLine(dc.byStatus) + '</div>';
  html += '<h3>By Developer Status</h3><div class="summary-box">' + dlpCountsLine(dc.byDeveloperStatus) + '</div>';
  html += '<h3>By Owner Verification</h3><div class="summary-box">' + dlpCountsLine(dc.byOwnerVerificationStatus) + '</div>';

  document.getElementById('dlpOverviewContent').innerHTML = html;
}

function dlpCountsLine(counts) {
  var parts = Object.keys(counts).map(function (k) { return escapeHtml(k) + ': ' + counts[k]; });
  return '<div class="summary-breakdown" style="margin-top:0">' + parts.join(' · ') + '</div>';
}

// ─── Defect List ─────────────────────────────────────────────────

function loadDlpDefectList() {
  document.getElementById('dlpListLoading').style.display = 'block';
  document.getElementById('dlpListContent').style.display = 'none';
  google.script.run
    .withSuccessHandler(function (res) {
      document.getElementById('dlpListLoading').style.display = 'none';
      document.getElementById('dlpListContent').style.display = 'block';
      if (!res.success) { showToast(res.error, true); return; }
      state.dlp.defects = res.data;
      renderDlpDefectList(res.data);
    })
    .withFailureHandler(function (err) {
      document.getElementById('dlpListLoading').style.display = 'none';
      showToast('Failed to load Defect List: ' + err.message, true);
    })
    .dlp_listSidebarDefects();
}

function renderDlpDefectList(defects) {
  var tbody = document.getElementById('dlpDefectRows');
  tbody.innerHTML = '';
  if (!defects || defects.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty">No defects found for this Case.</td></tr>';
    return;
  }
  defects.forEach(function (d) {
    var tr = document.createElement('tr');
    tr.dataset.defectId = d.defectId;
    tr.innerHTML =
      '<td title="' + escapeHtml(d.itemId) + '">' + escapeHtml(d.itemId || '—') + '</td>' +
      '<td title="' + escapeHtml(d.category) + '">' + escapeHtml(d.category) + '</td>' +
      '<td title="' + escapeHtml(d.subCategory) + '">' + escapeHtml(d.subCategory || '—') + '</td>' +
      '<td title="' + escapeHtml(d.description) + '">' + escapeHtml(d.description) + '</td>' +
      '<td title="' + escapeHtml(d.remark) + '">' + escapeHtml(d.remark || '—') + '</td>' +
      '<td title="' + escapeHtml(d.location) + '">' + escapeHtml(d.location) + '</td>' +
      '<td>' + escapeHtml(d.priority) + '</td>' +
      '<td>' + dlpBadge(d.status) + '</td>' +
      '<td>' + dlpBadge(d.developerStatus) + '</td>' +
      '<td>' + dlpBadge(d.ownerVerificationStatus) + '</td>';
    tr.addEventListener('click', function () { openDlpDefectDetail(d.defectId); });
    tbody.appendChild(tr);
  });
}

function dlpBadge(value) {
  var cls = 'status-' + String(value || '').toLowerCase().replace(/[^a-z]/g, '');
  return '<span class="badge ' + cls + '">' + escapeHtml(value) + '</span>';
}

function dlpField(label, value) {
  var isEmpty = !value && value !== 0;
  return '<div class="detail-field"><span class="detail-label">' + escapeHtml(label) + '</span>' +
    '<span class="detail-value' + (isEmpty ? ' empty' : '') + '">' +
    (isEmpty ? '—' : escapeHtml(String(value))) + '</span></div>';
}

// ─── Defect Detail ───────────────────────────────────────────────

function openDlpDefectDetail(defectId) {
  state.dlp.currentDefectId = defectId;
  showDlpSub('detail');
  document.getElementById('dlpDetailLoading').style.display = 'block';
  document.getElementById('dlpDetailContent').style.display = 'none';
  google.script.run
    .withSuccessHandler(function (res) {
      document.getElementById('dlpDetailLoading').style.display = 'none';
      document.getElementById('dlpDetailContent').style.display = 'block';
      if (!res.success) { showToast(res.error, true); return; }
      renderDlpDefectDetail(res.data);
    })
    .withFailureHandler(function (err) {
      document.getElementById('dlpDetailLoading').style.display = 'none';
      showToast('Failed to load Defect Detail: ' + err.message, true);
    })
    .dlp_getSidebarDefectDetail(defectId);
}

// defect is 918's raw DefectItem shape (PascalCase field names) —
// dlp_getSidebarDefectDetail is a bare pass-through of getDefectItem(),
// not remapped to the List's camelCase shape (see that wrapper's own
// comment in 947 for why). Rectification Events/Evidence/Secondary
// Damage are not shown here yet — next round, once their own 922
// aggregation function exists (Contract §18).
function renderDlpDefectDetail(defect) {
  var html = '<div class="detail-grid">' +
    dlpField('ItemID', defect.ItemID) +
    dlpField('Category', defect.Category) +
    dlpField('SubCategory', defect.SubCategory) +
    dlpField('Description', defect.Description) +
    dlpField('Remark', defect.Remark) +
    dlpField('Location', defect.Location) +
    dlpField('Priority', defect.Priority) +
    '<div class="detail-field"><span class="detail-label">Status</span><span class="detail-value">' + dlpBadge(defect.Status) + '</span></div>' +
    '<div class="detail-field"><span class="detail-label">Developer Status</span><span class="detail-value">' + dlpBadge(defect.DeveloperStatus) + '</span></div>' +
    '<div class="detail-field"><span class="detail-label">Owner Verification</span><span class="detail-value">' + dlpBadge(defect.OwnerVerificationStatus) + '</span></div>' +
    dlpField('Submitted', defect.SubmittedAt) +
    dlpField('Rectification Start', defect.RectificationStartDate) +
    dlpField('Developer Claimed Completed', defect.DeveloperClaimedCompletedDate) +
    dlpField('Owner Verified', defect.OwnerVerifiedDate) +
    dlpField('Closed', defect.ClosedDate) +
    dlpField('Created', defect.CreatedAt) +
    dlpField('Updated', defect.UpdatedAt) +
    '</div>';

  html += '<h3>Update Developer Status</h3><div class="detail-grid">' +
    '<div class="field"><label>Status</label><select id="dlp_devStatus"></select></div>' +
    '<div class="field" id="dlp_devDateField"><label>Claimed Completed Date (optional — defaults to now)</label><input id="dlp_devDate" type="date"></div>' +
    '<div class="field"><label>Note (optional)</label><textarea id="dlp_devNote" rows="2"></textarea></div>' +
    '<button class="btn" id="dlp_devSubmit" style="width:100%">Update Developer Status</button>' +
    '</div>';

  html += '<h3>Record Owner Verification</h3><div class="detail-grid">' +
    '<div class="field"><label>Verification Status</label><select id="dlp_ownerStatus"></select></div>' +
    '<div class="field"><label>Verified Date (optional — defaults to now)</label><input id="dlp_ownerDate" type="date"></div>' +
    '<div class="field"><label>Reason (optional)</label><textarea id="dlp_ownerReason" rows="2"></textarea></div>' +
    '<button class="btn" id="dlp_ownerSubmit" style="width:100%">Record Owner Verification</button>' +
    '</div>';

  document.getElementById('dlpDetailContent').innerHTML = html;

  var opts = state.dlp.formOptions || { developerStatuses: [], ownerVerificationStatuses: [] };
  fillSelect('dlp_devStatus', opts.developerStatuses);
  document.getElementById('dlp_devStatus').value = defect.DeveloperStatus;
  fillSelect('dlp_ownerStatus', opts.ownerVerificationStatuses);
  document.getElementById('dlp_ownerStatus').value = defect.OwnerVerificationStatus;

  toggleDlpDevDateField();
  document.getElementById('dlp_devStatus').addEventListener('change', toggleDlpDevDateField);

  document.getElementById('dlp_devSubmit').addEventListener('click', function () {
    submitDlpDeveloperStatus(defect.DefectID);
  });
  document.getElementById('dlp_ownerSubmit').addEventListener('click', function () {
    submitDlpOwnerVerification(defect.DefectID);
  });
}

function toggleDlpDevDateField() {
  var isClaimedCompleted = document.getElementById('dlp_devStatus').value === 'ClaimedCompleted';
  document.getElementById('dlp_devDateField').style.display = isClaimedCompleted ? 'block' : 'none';
}

// claimedCompletedDate is only sent when ClaimedCompleted is selected AND
// a date was actually entered — otherwise omitted so 918's own
// defaults-to-now applies (Contract §5), not a client-guessed date.
function submitDlpDeveloperStatus(defectId) {
  var btn = document.getElementById('dlp_devSubmit');
  var developerStatus = document.getElementById('dlp_devStatus').value;
  var input = {
    defectId: defectId,
    developerStatus: developerStatus,
    note: document.getElementById('dlp_devNote').value || ''
  };
  if (developerStatus === 'ClaimedCompleted') {
    var dateVal = document.getElementById('dlp_devDate').value;
    if (dateVal) input.claimedCompletedDate = dateVal;
  }
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.error, true); return; }
      showToast('Developer status updated.');
      openDlpDefectDetail(defectId);
      loadDlpDefectList();
    })
    .withFailureHandler(function (err) { btn.disabled = false; showToast(err.message, true); })
    .dlp_recordDeveloperStatus(input);
}

// Deliberately always enabled, never locked after a first verification —
// FailedVerification is re-recordable (Contract §6, NOT a one-way field).
function submitDlpOwnerVerification(defectId) {
  var btn = document.getElementById('dlp_ownerSubmit');
  var input = {
    defectId: defectId,
    ownerVerificationStatus: document.getElementById('dlp_ownerStatus').value,
    reason: document.getElementById('dlp_ownerReason').value || ''
  };
  var dateVal = document.getElementById('dlp_ownerDate').value;
  if (dateVal) input.verifiedDate = dateVal;
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.error, true); return; }
      showToast('Owner verification recorded.');
      openDlpDefectDetail(defectId);
      loadDlpDefectList();
    })
    .withFailureHandler(function (err) { btn.disabled = false; showToast(err.message, true); })
    .dlp_recordOwnerVerification(input);
}

// ─── Utilities ─────────────────────────────────────────────────────

function formatAmount(n) {
  n = Number(n) || 0;
  return n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(s) {
  var div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

var toastTimer;
function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
</script>
</body>
</html>
